name: CI

on:
  push:
    branches: [main]
    tags: ['v*', 'chart-v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make check
      # make fmt rewrites files; unformatted code shows up as a diff.
      - run: git diff --exit-code

  integration:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: make test-integration

  e2e:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Playwright uses the runner's preinstalled Google Chrome (channel: chrome).
      - run: make e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: |
            web/test-results/
            web/e2e/.tmp/server.log
            web/e2e/.tmp/server-mode.log
          retention-days: 7

  # Installs the Helm chart in kind and signs in through it. kubectl comes
  # with the runner image.
  chart:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Dependabot does not see this pin: bump the version and the checksum
      # together.
      - name: Install kind
        run: |
          mkdir "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/bin/kind" "https://github.com/kubernetes-sigs/kind/releases/download/v$KIND_VERSION/kind-linux-amd64"
          echo "$KIND_SHA256  $RUNNER_TEMP/bin/kind" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/kind"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
        env:
          KIND_VERSION: 0.30.0
          KIND_SHA256: 517ab7fc89ddeed5fa65abf71530d90648d9638ef0c4cde22c2c11f8097b8889
      - run: make chart-kind

  # Each architecture is built and run natively, so no emulation is needed.
  image:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    # A stable name: branch protection requires these checks by name.
    name: image-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make image-multiarch PLATFORMS="linux/$ARCH"
        env:
          ARCH: ${{ matrix.arch }}

  # The release archives, built on every run so a PR shows they still build.
  binaries:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make dist
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: dist/
          retention-days: 7

  # Runs each archive's binary natively, as a user would after the quick start.
  binaries-check:
    needs: binaries
    strategy:
      matrix:
        include:
          - name: Linux_x86_64
            runner: ubuntu-26.04
          - name: Linux_aarch64
            runner: ubuntu-26.04-arm
          - name: Darwin_arm64
            runner: macos-26
          - name: Darwin_x86_64
            runner: macos-15-intel
    name: binary-${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
      - run: |
          shasum -a 256 -c ldaplens_checksums.txt
          # The quick start's URL: uname must name this runner's archive.
          [ "$(uname -s)_$(uname -m)" = "$NAME" ] || { echo "::error::uname gives $(uname -s)_$(uname -m), want $NAME"; exit 1; }
          tar -xzf "ldaplens_$(uname -s)_$(uname -m).tar.gz" ldaplens
          got=$(./ldaplens --version)
          [ "$got" = "ldaplens $VERSION" ] || { echo "::error::--version printed '$got', want 'ldaplens $VERSION'"; exit 1; }
          echo "$NAME: ok, $got"
        env:
          NAME: ${{ matrix.name }}
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}

  # A v* tag on main publishes one multi-arch image, with an SBOM and a signed
  # provenance attestation, after every check passes, then the Helm chart
  # with that appVersion, then a draft GitHub release with the attested
  # binaries; its notes are written and it is published by hand. A chart-v*
  # tag on main publishes only the chart.
  # The Go and Node stages run on the build platform, so the arm64 half needs
  # no QEMU.
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/chart-v')
    needs: [check, integration, e2e, image, chart, binaries-check]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: release # tag rules v* and chart-v*, optional required reviewer
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: write # create the draft release with the binaries
      packages: write # push the image and the chart to ghcr.io
      id-token: write # Sigstore certificate for the attestations
      attestations: write # store the attestations
      artifact-metadata: write # storage records for the pushed image and chart
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags and origin/main for the checks below
          persist-credentials: false
      - name: Require a release tag on main
        id: tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^(chart-)?v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::release tags must be vX.Y.Z or chart-vX.Y.Z, either with -pre"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::the tagged commit is not on main"; exit 1; }
          chart=$(scripts/chart-version-check.sh "$GITHUB_REF_NAME" deploy/helm/ldaplens/Chart.yaml)
          echo "chart=$chart" >>"$GITHUB_OUTPUT"
      # Dependabot does not see this pin: bump it with HELM_MIN in the
      # Makefile.
      - name: Install Helm
        run: |
          curl -fsSLo "$RUNNER_TEMP/helm.tgz" "https://get.helm.sh/helm-v$HELM_VERSION-linux-amd64.tar.gz"
          echo "$HELM_SHA256  $RUNNER_TEMP/helm.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP" linux-amd64/helm
          echo "$RUNNER_TEMP/linux-amd64" >>"$GITHUB_PATH"
        env:
          HELM_VERSION: 4.3.2
          HELM_SHA256: d1c0278d46beab79582d7e50f5b3dc206944ba8e577cde618513fd07daa53983
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Dependabot does not see this pin: bump it by hand.
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      # Helm and the attestations push with this login too.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A re-run finds its chart in ghcr, skips the push and attests that
      # chart again, once its content matches this commit's file by file.
      # Only a clear "not there" leads to a push. Other content under that
      # version (bump version in Chart.yaml) or any other lookup error stops
      # the job before anything is pushed.
      - name: Look for the chart in ghcr
        id: ghcr
        run: |
          found=yes
          helm pull oci://ghcr.io/cicdteam/charts/ldaplens --version "$CHART" --untar -d "$RUNNER_TEMP/ghcr" >"$RUNNER_TEMP/pull.log" 2>&1 || found=no
          cat "$RUNNER_TEMP/pull.log"
          if [ "$found" = no ]; then
            # ghcr answers 403 denied, not 404, for a package that does not
            # exist yet. A token that cannot read the chart cannot overwrite it.
            grep -qE '^Error: .*(: not found|response status code 403: denied: requested access to the resource is denied)$' "$RUNNER_TEMP/pull.log" ||
              { echo "::error::cannot tell whether chart $CHART is in ghcr"; exit 1; }
            echo "chart $CHART is not in ghcr, pushing it"
            exit 0
          fi
          helm package deploy/helm/ldaplens -d "$RUNNER_TEMP/local"
          tar -xzf "$RUNNER_TEMP/local/ldaplens-$CHART.tgz" -C "$RUNNER_TEMP/local"
          diff -r "$RUNNER_TEMP/ghcr/ldaplens" "$RUNNER_TEMP/local/ldaplens" ||
            { echo "::error::chart $CHART is in ghcr with other content than this commit: bump version in Chart.yaml"; exit 1; }
          digest=$(sed -n 's/^Digest: //p' "$RUNNER_TEMP/pull.log")
          echo "chart $CHART is in ghcr already with this content, skipping its push"
          echo "digest=${digest:?no Digest in the helm pull output}" >>"$GITHUB_OUTPUT"
        env:
          CHART: ${{ steps.tag.outputs.chart }}
      - if: startsWith(github.ref, 'refs/tags/v')
        id: build
        run: |
          image="ghcr.io/$GITHUB_REPOSITORY"
          tags=(-t "$image:${GITHUB_REF_NAME#v}")
          # latest only for the highest final release on main: not a pre-release, a backport or a re-run of an old tag.
          newest=$(git tag -l 'v*' --merged origin/main --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          if [ "$GITHUB_REF_NAME" = "$newest" ]; then tags+=(-t "$image:latest"); fi
          # Dependabot does not track the SBOM scanner pin below: bump it by hand.
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$GITHUB_REF_NAME" \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.version="${GITHUB_REF_NAME#v}" \
            --label org.opencontainers.image.licenses=Apache-2.0 \
            --sbom=generator=docker/buildkit-syft-scanner:stable-1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315 \
            --metadata-file "$RUNNER_TEMP/build.json" \
            "${tags[@]}" -f deploy/Dockerfile --push .
          echo "digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/build.json")" >>"$GITHUB_OUTPUT"
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - if: steps.ghcr.outputs.digest == ''
        name: Push the chart
        id: chart
        run: |
          helm package deploy/helm/ldaplens -d "$RUNNER_TEMP"
          # Both streams: Helm has printed the Digest: line to stderr.
          pushed=$(helm push "$RUNNER_TEMP/ldaplens-$CHART.tgz" oci://ghcr.io/cicdteam/charts 2>&1) || { echo "$pushed"; exit 1; }
          echo "$pushed"
          digest=$(sed -n 's/^Digest: //p' <<<"$pushed")
          echo "digest=${digest:?no Digest in the helm push output}" >>"$GITHUB_OUTPUT"
        env:
          CHART: ${{ steps.tag.outputs.chart }}
      # Runs on a re-run too, so a chart whose attestation failed gets one.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/cicdteam/charts/ldaplens
          # The pushed chart, or the same chart found in ghcr.
          subject-digest: ${{ steps.chart.outputs.digest || steps.ghcr.outputs.digest }}
          push-to-registry: true
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: dist
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      # A re-run fills a draft again but leaves a published release alone.
      - if: startsWith(github.ref, 'refs/tags/v')
        name: Attach the binaries to a draft release
        run: |
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            [ "$draft" = true ] || { echo "release $GITHUB_REF_NAME is published already, leaving its assets"; exit 0; }
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "$GITHUB_REF_NAME" --notes "Notes to come."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  # Runs the image check on the pushed image itself, pulled by digest without a
  # login, as a user would. A chart-v* tag pushes no image.
  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    name: verify-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          docker pull --platform "linux/$ARCH" "$IMAGE"
          deploy/image-check.sh "$IMAGE" "linux/$ARCH" "$GITHUB_REF_NAME"
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ needs.publish.outputs.digest }}
          ARCH: ${{ matrix.arch }}
