# Demo: ldaplens in local mode next to an OpenLDAP and a Samba AD with sample
# users. Start it with `make demo-start`, then open
# http://127.0.0.1:8080/?token=demo-token-not-secret.
name: ldaplens-demo
services:
  openldap:
    build: ./openldap
    ports:
      - "127.0.0.1:1389:1389" # for local UI development, see docs/development.md
    volumes:
      # The file, not the directory: the image loads every .ldif in /ldifs.
      - ./demo-ldif/demo.ldif:/ldifs/demo.ldif:ro
    healthcheck:
      # The image loads the LDIF before slapd listens: the first answer means
      # the data is there.
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost:1389 -b ou=people,dc=example,dc=org -s base dn >/dev/null"]
      interval: 1s
      timeout: 5s
      retries: 90

  samba:
    image: smblds/smblds@sha256:af3586e5b73b159556af30b77bb73207cb60253e4281b698c58d6a846a3061f8
    # No host port: ldaplens and samba-seed reach LDAPS (CA in
    # deploy/ad-test/tls/ca.pem) on the compose network.
    environment:
      REALM: CORP.EXAMPLE.TEST
      DOMAIN: CORP
      ADMINPASS: Adm1nPassw0rd! # demo only
    volumes:
      - ./ad-test/tls:/certs:ro
      - ./ad-test/10-tls.sh:/entrypoint.d/10-tls.sh:ro
    healthcheck:
      # The image's own check passes while Samba is still provisioning: wait
      # for an Administrator bind over LDAPS. The image's ldapwhoami wrapper
      # binds as Administrator (-x -y /root/.ldappass) to ldaps://localhost
      # (/root/.ldaprc, which also skips the certificate check).
      test: ["CMD-SHELL", "ldapwhoami >/dev/null 2>&1"]
      interval: 1s
      timeout: 5s
      retries: 90

  # Loads the AD demo directory once Samba is up; ldaplens waits for it. The bind
  # is probed for up to 60 s, then ldapadd runs once, unless the file's last
  # entry is already there (make demo-start while the demo runs re-runs this
  # against the same Samba). /usr/bin, not the image's wrappers, which read
  # the Administrator password from /root/.ldappass.
  samba-seed:
    image: smblds/smblds@sha256:af3586e5b73b159556af30b77bb73207cb60253e4281b698c58d6a846a3061f8
    depends_on:
      samba:
        condition: service_healthy
    environment:
      LDAPTLS_CACERT: /certs/ca.pem
      DN: CN=Administrator,CN=Users,DC=corp,DC=example,DC=test
      PW: Adm1nPassw0rd! # demo only
    volumes:
      - ./ad-test/tls:/certs:ro
      - ./demo-ldif/ad-demo.ldif:/seed/ad-demo.ldif:ro
    entrypoint:
      - sh
      - -c
      - |
        for i in $$(seq 60); do
          /usr/bin/ldapwhoami -x -H ldaps://samba -D "$$DN" -w "$$PW" >/dev/null 2>&1 && break
          sleep 1
        done
        /usr/bin/ldapsearch -x -H ldaps://samba -D "$$DN" -w "$$PW" -s base -b "CN=All Bulk,OU=Groups,OU=Demo,DC=corp,DC=example,DC=test" dn >/dev/null 2>&1 && exit 0
        exec /usr/bin/ldapadd -x -H ldaps://samba -D "$$DN" -w "$$PW" -f /seed/ad-demo.ldif >/dev/null

  ldaplens:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    # Local mode, so the demo shows saving connections and trusting a CA.
    command: [local]
    depends_on:
      openldap:
        condition: service_healthy
      samba-seed:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${DEMO_PORT:-8080}:8080"
    environment:
      LDAPLENS_CONFIG: /etc/ldaplens/connections.yaml
      LDAPLENS_AUTH_TOKEN: demo-token-not-secret # demo only; omit to use the token kept in the volume, printed in the log
      DEMO_LDAP_PASSWORD: adminpassword
      AD_LDAP_PASSWORD: Adm1nPassw0rd! # demo only
    volumes:
      - ./connections.demo.yaml:/etc/ldaplens/connections.yaml:ro
      - ./ad-test/tls/ca.pem:/etc/ldaplens/ad-ca.pem:ro
      - ldaplens-data:/data

volumes:
  ldaplens-data: {}
