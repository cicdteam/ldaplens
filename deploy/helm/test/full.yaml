# Every value set.
image:
  repository: registry.corp.example/ldaplens
  tag: 1.4.0-rc.1
  pullPolicy: Always
imagePullSecrets:
  - name: corp-registry
replicaCount: 3
trustedProxies: [10.244.0.0/16, 192.0.2.10]
notice: Test directory, reset every night. Use <b>your own</b> uid.
noticeColor: "#f59e0b"
session:
  idle: 15m
  maxAge: 4h
connections:
  - name: people
    label: Corp people (sign in with your uid)
    url: ldaps://ldap.corp.example:636
    baseDN: dc=corp,dc=example
    bindDNTemplate: uid={user},ou=people,dc=corp,dc=example
    caFile: corp-ca.pem
    color: "#1f6feb"
    readOnly: true
    connectTimeout: 5s
    searchTimeout: 1m30s
  - name: corp-ad
    url: ldap://dc1.corp.example:389
    startTLS: true
    baseDN: DC=corp,DC=example
    bindDNTemplate: "{user}@corp.example"
    insecureSkipVerify: false
    caPEM: |
      -----BEGIN CERTIFICATE-----
      (the domain's CA certificate)
      -----END CERTIFICATE-----
caCerts:
  corp-ca.pem: |
    -----BEGIN CERTIFICATE-----
    (the directory's CA certificate)
    -----END CERTIFICATE-----
goMemLimit: 800MiB
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {memory: 1Gi}
podAnnotations: {example.com/team: directory}
podLabels: {example.com/team: directory}
nodeSelector: {kubernetes.io/os: linux}
tolerations:
  - {key: dedicated, operator: Equal, value: tools, effect: NoSchedule}
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels: {app.kubernetes.io/name: ldaplens, app.kubernetes.io/instance: ldaplens}
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels: {app.kubernetes.io/name: ldaplens, app.kubernetes.io/instance: ldaplens}
pdb:
  enabled: true
  minAvailable: 2
networkPolicy:
  enabled: true
  from:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: traefik}
service:
  port: 8080
  annotations:
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 16m
  tls:
    - hosts: [ldaplens.corp.example]
      secretName: ldaplens-tls
global: {}
